<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API kuvatesti</title>
<style>
body{font-family:sans-serif;padding:1rem;background:#111;color:#fff;}
.test{margin:1rem 0;padding:1rem;background:#222;border-radius:8px;}
img{max-width:200px;max-height:150px;display:block;margin:.5rem 0;}
.ok{color:#4f4;} .fail{color:#f44;}
</style>
</head>
<body>
<h2>API kuvatesti</h2>

<div class="test">
  <b>1. Wikimedia Commons API thumbnail URL</b>
  <img id="i1"><div id="s1">Haetaan...</div>
</div>

<div class="test">
  <b>2. Open Library covers (kirjat)</b>
  <img id="i2" src="https://covers.openlibrary.org/b/id/8226197-M.jpg">
  <div id="s2">Ladataan...</div>
</div>

<div class="test">
  <b>3. Wikimedia thumbs via different approach</b>
  <img id="i3"><div id="s3">Haetaan...</div>
</div>

<div class="test">
  <b>4. The Movie DB (elokuvat)</b>
  <img id="i4" src="https://image.tmdb.org/t/p/w500/rBX3K98HaLfA0aSFx8Q3PqZbX2j.jpg">
  <div id="s4">Ladataan...</div>
</div>

<script>
// Test 1: Wikimedia API
fetch('https://commons.wikimedia.org/w/api.php?action=query&titles=File:Ferrari_SF90_Stradale.jpg&prop=imageinfo&iiprop=url&iiurlwidth=400&format=json&origin=*')
  .then(r=>r.json()).then(data=>{
    const p=Object.values(data.query.pages)[0];
    const url=p.imageinfo[0].thumburl;
    document.getElementById('s1').textContent='URL: '+url.substring(0,80);
    const img=document.getElementById('i1');
    img.onload=()=>{document.getElementById('s1').className='ok';document.getElementById('s1').textContent='✅ TOIMII! '+url.substring(0,60);};
    img.onerror=()=>{
      document.getElementById('s1').className='fail';
      document.getElementById('s1').textContent='❌ URL saatu mutta ei lataudu: '+url.substring(0,80);
    };
    img.src=url;
  }).catch(e=>{document.getElementById('s1').textContent='❌ Fetch fail: '+e;});

// Test 3: Wikimedia REST API
fetch('https://en.wikipedia.org/api/rest_v1/page/summary/Ferrari')
  .then(r=>r.json()).then(data=>{
    const url=data.thumbnail&&data.thumbnail.source;
    document.getElementById('s3').textContent='URL: '+(url||'ei kuvaa');
    if(url){
      const img=document.getElementById('i3');
      img.onload=()=>{document.getElementById('s3').className='ok';document.getElementById('s3').textContent='✅ Wikipedia REST API toimii!';};
      img.onerror=()=>{document.getElementById('s3').className='fail';document.getElementById('s3').textContent='❌ URL saatu mutta ei lataudu: '+url.substring(0,80);};
      img.src=url;
    }
  }).catch(e=>{document.getElementById('s3').textContent='❌ Fetch fail: '+e;});

// Test 2 and 4
[2,4].forEach(i=>{
  const img=document.getElementById('i'+i);
  const span=document.getElementById('s'+i);
  img.onload=()=>{span.className='ok';span.textContent='✅ TOIMII';};
  img.onerror=()=>{span.className='fail';span.textContent='❌ EI TOIMI';};
});
</script>
</body>
</html>
